## EMQX 5.x 配置（HOCON 风格）
##
## 本地开发用：匿名访问 + 宽松 ACL，便于设备和 backend 不带账号即可联调。
##
## 上公网 / 量产前必须改：
##   1) authentication 加 password_based + 写明账号（或接 PostgreSQL/HTTP source）；
##   2) authorization 改 no_match = deny，明确允许 fridge/# 主题；
##   3) 关闭匿名（默认 allow_anonymous=true 时空 authentication 数组即匿名）；
##   4) listeners.tcp 改为 SSL（mqtts 1884）。
## 这些改动要同步修改 backend `.env` 的 MQTT_USERNAME / MQTT_PASSWORD，并把设备端 NVS
## 里的 broker URI 从 mqtt:// 切到 mqtts:// 才能联通。

node {
  name = "fridge_spirit_emqx@127.0.0.1"
  cookie = "fridge_spirit_demo_cookie"
  data_dir = "/opt/emqx/data"
}

## 原生 MQTT TCP 监听口，设备 / backend 均通过这里连接。
listeners.tcp.default {
  bind = "0.0.0.0:1883"
  max_connections = 1024
}

## WebSocket 监听口，给 Nginx /mqtt-ws/ 反代用。
## 浏览器或调试工具可以通过 ws://localhost:8083/mqtt 连接。
listeners.ws.default {
  bind = "0.0.0.0:8083"
  websocket {
    mqtt_path = "/mqtt"
  }
}

## 管理控制台，开发期默认 admin / public。
dashboard {
  listeners.http {
    bind = 18083
  }
  default_username = "admin"
  default_password = "public"
}

## 单条消息上限：AI 回复理论可能较长，给 256 KB 余量；
## 设备端 fridge_mqtt_protocol.c 实际会先在端内截断到 4 KB。
mqtt {
  max_packet_size = 256KB
  max_topic_levels = 16
}

## 不配置 authentication 数组 == 允许匿名（仅限本地）。
authentication = []

## 授权策略：未命中 ACL 时一律放行（开发期）。
## 生产改为：no_match = deny，并配置具体 ACL 源（builtin_db / postgresql / http）。
authorization {
  no_match = allow
  deny_action = ignore
  sources = []
}

## 日志：开发期保留 info 级，方便看到设备连接 / 订阅 / 断开。
log {
  console {
    enable = true
    level = info
  }
  file {
    enable = true
    level = info
    path = "/opt/emqx/log/emqx.log"
    rotation_count = 5
    rotation_size = 50MB
  }
}
