## Nginx 反向代理：把 /healthz、/api/、/docs、/openapi.json、/mqtt-ws/ 都聚合到 6005。
## /mqtt-ws/ 透传 WebSocket 升级头，让浏览器调试工具能通过 nginx 直连 EMQX。
## client_max_body_size 留 20m 给 /api/v1/inventory/scan 上传图片（backend 内部限 5m，
## 这里宽松一点避免 nginx 提前 413）。

server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    location /healthz {
        proxy_pass http://api:8000/healthz;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # /ai/chat 在设备转发场景下最久要等设备 30s 才回 ack；
        # 给上游 60s 余量避免 504。
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location /docs {
        proxy_pass http://api:8000/docs;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://api:8000/openapi.json;
        proxy_set_header Host $host;
    }

    ## EMQX WebSocket 透传：浏览器/调试工具可以走 ws://<host>:6005/mqtt-ws/mqtt。
    ## 注意 Upgrade/Connection 头是 WebSocket 必需的。
    location /mqtt-ws/ {
        proxy_pass http://emqx:8083/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # MQTT 心跳间隔默认 60s，反代超时给 24h 让长连接不被切断。
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
